    <script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "VideoGame", "@id": "https://quickybricks.com/#app", "name": "QuickyBricks", "url": "https://quickybricks.com/", "description": "Roll, doodle and hatch a giggly family of squishy 3D cubes. Hold hands with other players' cubes to make cube babies. A silly browser game to play with a grown-up.", "image": "https://quickybricks.com/_/theme/og-image.png", "inLanguage": "en", "publisher": {"@id": "https://arkvital.com/#org"}, "keywords": "3D game for kids, silly browser game, family game online, cute cube game, play with your child, doodle game, kids game no download, character creator game, three.js game", "applicationCategory": "GameApplication", "operatingSystem": "Any (web browser)", "browserRequirements": "Requires JavaScript and a modern web browser", "featureList": ["A real 3D cube to roll, recolour, doodle on and name, right on the landing page", "Six roll events with sounds and particles", "Up to 10 hand-made cubes per player", "Hold hands in the shared World to make cube babies", "Babies blend their parents' eyes, mouth, colour and name"], "audience": {"@type": "Audience", "audienceType": "Kids playing with a grown-up (accounts are 16+)"}}, {"@type": "WebSite", "@id": "https://quickybricks.com/#site", "url": "https://quickybricks.com/", "name": "QuickyBricks", "publisher": {"@id": "https://arkvital.com/#org"}}, {"@type": "Organization", "@id": "https://arkvital.com/#org", "name": "Arkvital", "url": "https://arkvital.com", "email": "arkvital@outlook.com", "address": {"@type": "PostalAddress", "addressLocality": "Montreal", "addressRegion": "QC", "addressCountry": "CA"}}]}</script>
