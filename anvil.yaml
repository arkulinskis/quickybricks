    >{\"@context\": \"https://schema.org\", \"@graph\": [{\"@type\": \"VideoGame\", \"@id\": \"https://quickybricks.com/#app\"\
    , \"name\": \"QuickyBricks\", \"url\": \"https://quickybricks.com/\", \"description\": \"Roll, doodle and hatch a giggly\
