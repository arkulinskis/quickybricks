    \ A silly browser game to play with a grown-up.\">\n<meta property=\"og:locale\" content=\"en_CA\">\n<meta property=\"\
    og:url\" content=\"https://quickybricks.com/\">\n<meta property=\"og:image\" content=\"https://quickybricks.com/_/theme/og-image.png\"\
    >\n<meta property=\"og:image:width\" content=\"1200\"><meta property=\"og:image:height\" content=\"630\">\n<meta property=\"\
    og:image:alt\" content=\"QuickyBricks: Roll, doodle and hatch a giggly family of squishy 3D cubes\">\n<meta name=\"twitter:card\"\
    \ content=\"summary_large_image\">\n<meta name=\"twitter:title\" content=\"QuickyBricks: a silly 3D cube game for kids\
    \ and grown-ups\">\n<meta name=\"twitter:description\" content=\"Roll, doodle and hatch a giggly family of squishy 3D\
    \ cubes. Hold hands with other players&#x27; cubes to make cube babies. A silly browser game to play with a grown-up.\"\
