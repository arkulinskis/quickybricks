<div class="ui-item ad-rep">
  <anvil-component type="QuickyBricks.Components.Thumb" name="thumb" prop:size="96"></anvil-component>
  <div class="grow">
    <div class="meta">
      <span class="ui-badge bad"><anvil-component type="Label" name="reason" prop:role='["inline"]'></anvil-component></span>
      <anvil-component type="Label" name="by" prop:role='["fine-print"]'></anvil-component>
    </div>
    <h3><a href="#cubby" anvil:name="cube_link"><anvil-component type="Label" name="cube_name" prop:role='["inline"]'></anvil-component></a></h3>
    <anvil-component type="Label" name="owner" prop:role='["fine-print"]'></anvil-component>
    <div class="ui-row ad-rep-actions">
      <anvil-component type="Button" name="wipe_button" prop:text="🧽 Wipe drawing" prop:role='["btn", "btn-sm"]'></anvil-component>
      <anvil-component type="Button" name="rename_button" prop:text="🔤 Random name" prop:role='["btn", "btn-sm"]'></anvil-component>
      <anvil-component type="Button" name="home_button" prop:text="🏠 Send home + close hands" prop:role='["btn", "btn-sm"]'></anvil-component>
      <anvil-component type="Button" name="dismiss_button" prop:text="Dismiss" prop:role='["btn", "btn-sm", "btn-ghost"]'></anvil-component>
    </div>
  </div>
</div>
