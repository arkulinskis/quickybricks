<div class="item-wrap">
<div class="cb-q" anvil:name="row">
  <span class="em" aria-hidden="true"><anvil-component type="Label" name="emoji" bind:text="self.item['emoji']"></anvil-component></span>
  <div>
    <anvil-component type="Label" name="text" prop:role='["cb-q-text"]' bind:text="self.item['text']"></anvil-component>
    <div class="bar" anvil:name="bar" role="img"><i anvil:name="fill"></i></div>
    <anvil-component type="Label" name="count" prop:role='["cb-small"]'></anvil-component>
  </div>
  <div class="cb-q-end">
    <span class="ui-badge good" anvil:name="got">Got it!</span>
    <anvil-component type="Button" name="claim_button" prop:role='["btn", "btn-sm"]'></anvil-component>
  </div>
</div>
</div>
