<div class="ui qb-dialog">
  <anvil-component type="Label" name="title" prop:role='["dlg-title"]'></anvil-component>
  <p class="dlg-lead">A grown-up moderator will take a look. Thanks for keeping QuickyBricks kind!</p>
  <div class="dlg-stack">
    <anvil-component type="Button" name="drawing_button" prop:text="🎨 A rude drawing" prop:role='["btn", "btn-block"]'></anvil-component>
    <anvil-component type="Button" name="name_button" prop:text="🔤 A rude name" prop:role='["btn", "btn-block"]'></anvil-component>
    <anvil-component type="Button" name="other_button" prop:text="❓ Something else" prop:role='["btn", "btn-block"]'></anvil-component>
  </div>
  <div class="ui-row end dlg-actions">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
  </div>
</div>
